name: Telco Churn Pipeline (every 2 minutes)

# GitHub Actions cron cannot run more often than every 5 minutes.
# Workaround: trigger every 6 minutes, and inside each job run the pipeline
# 3 times, 2 minutes apart (minute 0, 2, 4). Together this gives a
# continuous ~2-minute cadence.
on:
  schedule:
    - cron: '*/6 * * * *'
  workflow_dispatch:   # lets you start it manually from the Actions tab

# Never let two runs overlap
concurrency:
  group: telco-pipeline
  cancel-in-progress: false

permissions:
  contents: write      # needed so the job can commit results back to the repo

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-pipeline.txt

      - name: Install dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Run pipeline 3 times, 2 minutes apart, and commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            echo "=== Pipeline run $i of 3 started at $(date -u +%FT%TZ) ==="
            python preprocess_eda.py \
              --input data/WA_Fn-UseC_-Telco-Customer-Churn.csv \
              --target Churn \
              --outdir output/

            # keep only the newest 100 run logs so the repo stays small
            ls -1t output/run_log_*.json | tail -n +101 | xargs -r rm --

            git add -A output
            git diff --cached --quiet || git commit -m "Pipeline run $i at $(date -u +%FT%TZ)"
            git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
            git push -q origin "HEAD:${GITHUB_REF_NAME}" || true

            if [ "$i" -lt 3 ]; then
              echo "Sleeping 120 seconds until next run..."
              sleep 120
            fi
          done
          echo "=== Job finished at $(date -u +%FT%TZ) ==="
